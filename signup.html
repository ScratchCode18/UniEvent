
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniEvent | Sign Up</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                UniEvent
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="login.html">Login</a>
                <a class="btn btn-light ms-lg-3" href="signup.html">
                    Sign Up
                </a>
            </div>
        </div>
    </nav>


    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-3">
                        Create Account
                    </h2>

                    <p class="text-center text-muted">
                        Join UniEvent and explore university events
                    </p>

                    <form id="signupForm">

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Full Name
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   placeholder="Enter your full name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email Address
                            </label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   placeholder="Enter your email"
                                   required>
                        </div>

    
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   minlength="8"
                                   placeholder="Create a password"
                                   required>
                        </div>

      
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="confirmPassword"
                                   placeholder="Confirm your password"
                                   required>
                        </div>

    
                        <div class="mb-3">
                            <label for="role" class="form-label">
                                Register As
                            </label>
                            <select class="form-select" id="role" required>
                                <option value="">Choose your role</option>
                                <option value="student">Student</option>
                                <option value="organizer">Event Organizer</option>
                            </select>
                        </div>

       
                        <div id="errorMessage"
                             class="alert alert-danger d-none"
                             role="alert">
                        </div>

  
                        <button type="submit"
                                class="btn btn-primary w-100">
                            Create Account
                        </button>

                    </form>

                    <p class="text-center mt-3 mb-0">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>

                </div>

            </div>
        </div>
    </section>


    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            &copy; 2026 UniEvent | University Event Management System
        </p>
    </footer>

 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        document.getElementById("signupForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const errorMessage =
                    document.getElementById("errorMessage");

                errorMessage.classList.add("d-none");

                if (password !== confirmPassword) {
                    errorMessage.textContent =
                        "Passwords do not match!";
                    errorMessage.classList.remove("d-none");
                    return;
                }

               
                alert("Demo form validated! No account has been created.");

                window.location.href = "login.html";
            });
    </script>

</body>
</html>
